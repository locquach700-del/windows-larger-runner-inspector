name: Windows Hardware Inspector

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hardware-inspector.yml"
      - "scripts/**"
      - "tests/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Use the exact label of a Windows Larger Runner, or keep the standard runner"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-2022-96core

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Windows hardware
    runs-on: ${{ inputs.runner_label || 'windows-2022' }}
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show runner identity
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"

      - name: Generate hardware report
        shell: pwsh
        run: |
          ./scripts/Check-Hardware.ps1 -OutputDirectory reports

      - name: Validate hardware report
        shell: pwsh
        run: |
          ./tests/Test-Hardware.ps1

      - name: Upload hardware report
        uses: actions/upload-artifact@v4
        with:
          name: hardware-report
          path: reports/
          if-no-files-found: error
          retention-days: 7
